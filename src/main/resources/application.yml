server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mofils
    username: root
    password: 1111
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 60
      minimum-idle: 10
      idle-timeout: 600000      # 10분
      max-lifetime: 1800000     # 30분
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 1795000 # (29분 55초)
      pool-name: HikariPool
      register-mbeans: true
  devtools:
    restart:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
kakao:
  api-key: ${KAKAO_API_KEY}
aws:
  s3:
    bucket: juhyunbucket
    region: ap-southeast-2
    base-url: "https://juhyunbucket.s3.ap-southeast-2.amazonaws.com"
  credentials:
    accessKey: ${AWS_ACCESS_KEY_ID}
    secretKey: ${AWS_SECRET_ACCESS_KEY}
location:
  base-latitude: ${LOCATION_BASE_LATITUDE}
  base-longitude: ${LOCATION_BASE_LONGITUDE}
  verification-radius: ${LOCATION_VERIFICATION_RADIUS}
  earth-ladius: ${LOCATION_EARTH_RADIUS}
